# Rime schema
# encoding: utf-8
# Variable-length projection of the curated Yime core.

schema:
  schema_id: yime_variable
  name: "Yime 变长模式"
  version: "2026-08-15-core-1166300-layout-6d00e609f689-rank-v1-erhua-mixed-v4-psc-peripheral-v1"
  dependencies:
    - yime_erhua_mixed_variable
    - yime_psc_peripheral_variable

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator@custom_phrase
    - table_translator@erhua_mixed
    - table_translator@psc_peripheral
    # script_translator builds a syllable graph, so an unfinished final
    # syllable can still complete after an already valid sentence prefix.
    - script_translator
    - punct_translator

speller:
  alphabet: "1234567890-=qwertyuiop[]\\asdfghjkl;'zxcvbnm,./JKLUIOM<>NGFDSREWQTYVCXPAZ"
  delimiter: " "

translator:
  dictionary: yime_variable
  user_dict: yime_variable_core_1166300_layout_6d00e609f689_rank_v1
  enable_user_dict: true
  enable_sentence: true
  sentence_over_completion: true
  enable_completion: true

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_variable
  db_class: stabledb
  enable_completion: true
  enable_sentence: true
  sentence_over_completion: true
  initial_quality: 1

erhua_mixed:
  dictionary: yime_erhua_mixed_variable
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
  initial_quality: 1

psc_peripheral:
  dictionary: yime_psc_peripheral_variable
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
  initial_quality: -1

menu:
  page_size: 5

punctuator:
  import_preset: default

key_binder:
  # Every printable key in Yime's alphabet is encoding data. Paging uses the
  # native PageUp/PageDown keys; do not import default printable-key bindings.
  bindings: []

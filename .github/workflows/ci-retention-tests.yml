name: CI retention tests

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/ci/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tools/ci -p 'test_*.py'

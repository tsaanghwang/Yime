# Final diagnostic regressions based on 115e9010cb12c0fea4db2d4cad6ced532d639a43.
name: Verify final CI regressions

on:
  push:
    branches: ['diagnostic/yime-final-regressions']
    paths:
      - '.github/workflows/verify-final-ci-regressions.yaml'
      - 'go-backend/input_methods/yime/yimebroker/connected_speech_reconnect_test.go'

permissions:
  contents: read

jobs:
  repeated-go-race:
    name: Repeated reconnect and timeout race regressions
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Use Go 1.26.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go-backend/go.sum
      - name: Install MSYS2 UCRT64 GCC for Go race detector
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Repeat reconnect lifecycle and timeout regressions ten times
        shell: pwsh
        run: |
          $GccPath = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin\gcc.exe'
          $ErrorActionPreference = 'Stop'

          $root = $env:GITHUB_WORKSPACE
          $backend = Join-Path $root 'go-backend'
          $cache = Join-Path $root '.tmp\gocache'
          $temp = Join-Path $root '.tmp\go-tmp'

          if (-not (Test-Path -LiteralPath $GccPath -PathType Leaf)) {
              throw "MSYS2 UCRT64 GCC was not found: $GccPath"
          }

          New-Item -ItemType Directory -Force -Path $cache, $temp | Out-Null
          $env:CGO_ENABLED = '1'
          $gccDir = Split-Path -Parent $GccPath
          if (($env:PATH -split ';') -notcontains $gccDir) {
              $env:PATH = "$gccDir;$env:PATH"
          }
          # Go 1.26 on Windows may reject an absolute CC command before it reaches GCC.
          # Resolve the executable through the PATH entry above instead.
          $env:CC = [IO.Path]::GetFileNameWithoutExtension($GccPath)
          $env:GOCACHE = $cache
          $env:GOTMPDIR = $temp

          Push-Location $backend
          try {
              & go test -race -count=10 -run '^(TestConnectedSpeechReconnectBrokerBundleDurableLifecycle|TestDispatcherEvictsTimedOutAndPanickingSessions|TestDispatcherBoundsFactoriesThatNeverReturn|TestDispatcherReleasesManagedIndexSessionOnCloseAndLateTimeout)$' ./input_methods/yime/yimebroker -timeout=300s
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          } finally {
              Pop-Location
          }

  static-installer:
    name: Static installer verifier PowerShell 5.1 and 7
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test static installer artifact verifier
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-installer-static.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-installer-static-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 installer-static test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-installer-static.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-installer-static-ci-ps7-$runId")

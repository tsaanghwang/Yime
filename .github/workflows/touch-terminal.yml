name: Touch terminal prototype

on:
  workflow_dispatch:
    inputs:
      package_purpose:
        description: 'Select packages only for a named delivery or reproduction'
        type: choice
        options: [checks-only, delivery, reproduction]
        default: checks-only
      package_architecture:
        description: 'Architectures to upload; all compilation checks still run'
        type: choice
        options: [both, x64, arm64]
        default: both
      package_reason:
        description: 'Required for package selection: delivery destination or issue'
        type: string
        default: ''
  push:
    branches: [main, 'codex/**']
    paths:
      - 'prototypes/touch-terminal/**'
      - '.github/workflows/touch-terminal.yml'
      - 'tools/ci/package_delivery.py'
      - 'tools/ci/test_package_delivery.py'
      - 'internal_data/**'
      - 'go-backend/input_methods/yime/data/**'
      - 'go-backend/input_methods/yime/codemode/**'
      - 'go-backend/cmd/yime-keyboard-lab/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/internal/touchkeyboard/**'
      - 'go-backend/cmd/yime-touch-keyboard/**'
      - 'tools/build_touch_keyboard_desktop.py'
      - 'tools/touch_keyboard_build_environment.py'
      - 'tools/yimecore/test_18u_build_environment.py'
      - 'tools/touch_keyboard_resources.py'
      - 'tools/check_touch_keyboard_package.py'
      - 'tools/test_check_touch_keyboard_package.py'
      - 'tools/yimecore/collect_arm64_host.py'
      - 'tools/yimecore/test_collect_arm64_host.py'
      - 'tools/yimecore/development-scope.*'
      - 'tools/yimecore/run-platform-experiment.ps1'
      - 'tools/yimecore/test-platform-experiment.ps1'
      - 'tools/yimecore/test-arm64-build-scope.ps1'
      - 'tools/generate_touch_keyboard_profiles.py'
      - 'tools/ascii_keyboard/**'
      - 'tools/generate_ascii_layout.py'
      - 'tools/resolve_manual_key_layout.py'
      - 'yime/utils/yinyuan_id_chain.py'
      - 'syllable/**'
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/touch-terminal/**'
      - '.github/workflows/touch-terminal.yml'
      - 'tools/ci/package_delivery.py'
      - 'tools/ci/test_package_delivery.py'
      - 'internal_data/**'
      - 'go-backend/input_methods/yime/data/**'
      - 'go-backend/input_methods/yime/codemode/**'
      - 'go-backend/cmd/yime-keyboard-lab/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/internal/touchkeyboard/**'
      - 'go-backend/cmd/yime-touch-keyboard/**'
      - 'tools/build_touch_keyboard_desktop.py'
      - 'tools/touch_keyboard_build_environment.py'
      - 'tools/yimecore/test_18u_build_environment.py'
      - 'tools/touch_keyboard_resources.py'
      - 'tools/check_touch_keyboard_package.py'
      - 'tools/test_check_touch_keyboard_package.py'
      - 'tools/yimecore/collect_arm64_host.py'
      - 'tools/yimecore/test_collect_arm64_host.py'
      - 'tools/yimecore/development-scope.*'
      - 'tools/yimecore/run-platform-experiment.ps1'
      - 'tools/yimecore/test-platform-experiment.ps1'
      - 'tools/yimecore/test-arm64-build-scope.ps1'
      - 'tools/generate_touch_keyboard_profiles.py'
      - 'tools/ascii_keyboard/**'
      - 'tools/generate_ascii_layout.py'
      - 'tools/resolve_manual_key_layout.py'
      - 'yime/utils/yinyuan_id_chain.py'
      - 'syllable/**'

permissions:
  contents: read

jobs:
  offline-prototype:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
      - name: Validate explicit package selection and actual source
        id: package-request
        env:
          PACKAGE_PURPOSE: ${{ inputs.package_purpose }}
          PACKAGE_ARCHITECTURE: ${{ inputs.package_architecture }}
          PACKAGE_REASON: ${{ inputs.package_reason }}
        run: python -X utf8 tools/ci/package_delivery.py request
      - name: Validate isolated source data and interaction contracts
        run: python -X utf8 prototypes/touch-terminal/validate.py
      - name: Check explicit package selection contracts
        run: python -X utf8 tools/ci/test_package_delivery.py
      - name: Check native host architecture detection
        run: python -X utf8 -m unittest discover -s tools/yimecore -p test_collect_arm64_host.py -v
      - name: Check portable execution architecture gates
        run: python -X utf8 -m unittest discover -s tools -p test_check_touch_keyboard_package.py -v
      - name: Check source-attributed builds without executing a compiler
        run: python -X utf8 -m unittest discover -s tools/yimecore -p test_18u_build_environment.py -v
      - name: Check platform build host and package boundaries
        run: python -X utf8 tools/powershell/run_checked.py --script tools/yimecore/test-platform-experiment.ps1 --edition ps7
      - name: Validate canonical ASCII projection metadata
        run: python -X utf8 tools/generate_ascii_layout.py --check
      - name: Validate real engine loopback session boundary
        working-directory: go-backend
        run: go test ./cmd/yime-keyboard-lab ./internal/keyboardlab ./cmd/yime-touch-keyboard ./internal/touchkeyboard ./internal/asciicodemode ./input_methods/yime/codemode
      - name: Check user compact geometry profiles
        run: python -X utf8 tools/generate_touch_keyboard_profiles.py --check
      - name: Restore hash-locked complete CN134 derived dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tools/touch_keyboard_resources.py fetch --output-dir .generated/touch-keyboard-resources
      - name: Build complete Chinese x64 desktop package
        run: python -X utf8 tools/build_touch_keyboard_desktop.py
      - name: Verify relocated package without a source checkout or OS input
        run: python -X utf8 tools/check_touch_keyboard_package.py --package .generated/touch-keyboard-desktop --report .generated/touch-keyboard-verification/package-check.json
      - name: Cross-build complete Chinese ARM64 package (not native acceptance)
        run: python -X utf8 tools/build_touch_keyboard_desktop.py --arch arm64 --output-dir .generated/touch-keyboard-desktop-arm64
      - name: Upload selected x64 package
        id: package-x64
        if: steps.package-request.outputs.upload_x64 == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: selected-${{ inputs.package_purpose }}-touch-terminal-x64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .generated/touch-keyboard-desktop/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record selected x64 upload identity
        if: steps.package-x64.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.package-x64.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package-x64.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.package-x64.outputs.artifact-url }}
        run: python -X utf8 tools/ci/package_delivery.py receipt --architecture x64
      - uses: actions/upload-artifact@v6
        with:
          name: touch-keyboard-package-verification-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .generated/touch-keyboard-verification/
          if-no-files-found: error
          retention-days: 5
      - name: Upload selected ARM64 package
        id: package-arm64
        if: steps.package-request.outputs.upload_arm64 == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: selected-${{ inputs.package_purpose }}-touch-terminal-arm64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .generated/touch-keyboard-desktop-arm64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record selected ARM64 upload identity
        if: steps.package-arm64.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.package-arm64.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package-arm64.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.package-arm64.outputs.artifact-url }}
        run: python -X utf8 tools/ci/package_delivery.py receipt --architecture arm64
      - name: Preserve selected package upload receipts
        if: always() && (steps.package-x64.outputs.artifact-id != '' || steps.package-arm64.outputs.artifact-id != '')
        uses: actions/upload-artifact@v6
        with:
          name: selected-${{ inputs.package_purpose }}-touch-terminal-receipt-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .generated/selected-package-receipts/*.json
          if-no-files-found: error
          retention-days: 14

name: Touch terminal prototype

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'prototypes/touch-terminal/**'
      - '.github/workflows/touch-terminal.yml'
      - 'internal_data/**'
      - 'go-backend/input_methods/yime/data/**'
      - 'go-backend/input_methods/yime/codemode/**'
      - 'go-backend/cmd/yime-keyboard-lab/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/internal/touchkeyboard/**'
      - 'go-backend/cmd/yime-touch-keyboard/**'
      - 'tools/build_touch_keyboard_desktop.py'
      - 'tools/touch_keyboard_resources.py'
      - 'tools/check_touch_keyboard_package.py'
      - 'tools/test_check_touch_keyboard_package.py'
      - 'tools/yimecore/collect_arm64_host.py'
      - 'tools/yimecore/test_collect_arm64_host.py'
      - 'tools/yimecore/development-scope.*'
      - 'tools/yimecore/run-platform-experiment.ps1'
      - 'tools/yimecore/test-platform-experiment.ps1'
      - 'tools/yimecore/test-arm64-build-scope.ps1'
      - 'tools/generate_touch_keyboard_profiles.py'
      - 'tools/ascii_keyboard/**'
      - 'tools/generate_ascii_layout.py'
      - 'tools/resolve_manual_key_layout.py'
      - 'yime/utils/yinyuan_id_chain.py'
      - 'syllable/**'
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/touch-terminal/**'
      - '.github/workflows/touch-terminal.yml'
      - 'internal_data/**'
      - 'go-backend/input_methods/yime/data/**'
      - 'go-backend/input_methods/yime/codemode/**'
      - 'go-backend/cmd/yime-keyboard-lab/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/internal/touchkeyboard/**'
      - 'go-backend/cmd/yime-touch-keyboard/**'
      - 'tools/build_touch_keyboard_desktop.py'
      - 'tools/touch_keyboard_resources.py'
      - 'tools/check_touch_keyboard_package.py'
      - 'tools/test_check_touch_keyboard_package.py'
      - 'tools/yimecore/collect_arm64_host.py'
      - 'tools/yimecore/test_collect_arm64_host.py'
      - 'tools/yimecore/development-scope.*'
      - 'tools/yimecore/run-platform-experiment.ps1'
      - 'tools/yimecore/test-platform-experiment.ps1'
      - 'tools/yimecore/test-arm64-build-scope.ps1'
      - 'tools/generate_touch_keyboard_profiles.py'
      - 'tools/ascii_keyboard/**'
      - 'tools/generate_ascii_layout.py'
      - 'tools/resolve_manual_key_layout.py'
      - 'yime/utils/yinyuan_id_chain.py'
      - 'syllable/**'

permissions:
  contents: read

jobs:
  offline-prototype:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
      - name: Validate isolated source data and interaction contracts
        run: python -X utf8 prototypes/touch-terminal/validate.py
      - name: Check native host architecture detection
        run: python -X utf8 -m unittest discover -s tools/yimecore -p test_collect_arm64_host.py -v
      - name: Check portable execution architecture gates
        run: python -X utf8 -m unittest discover -s tools -p test_check_touch_keyboard_package.py -v
      - name: Check platform build host and package boundaries
        run: python -X utf8 tools/powershell/run_checked.py --script tools/yimecore/test-platform-experiment.ps1 --edition ps7
      - name: Validate canonical ASCII projection metadata
        run: python -X utf8 tools/generate_ascii_layout.py --check
      - name: Validate real engine loopback session boundary
        working-directory: go-backend
        run: go test ./cmd/yime-keyboard-lab ./internal/keyboardlab ./cmd/yime-touch-keyboard ./internal/touchkeyboard ./internal/asciicodemode ./input_methods/yime/codemode
      - name: Check user compact geometry profiles
        run: python -X utf8 tools/generate_touch_keyboard_profiles.py --check
      - name: Restore hash-locked complete CN134 derived dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tools/touch_keyboard_resources.py fetch --output-dir .generated/touch-keyboard-resources
      - name: Build complete Chinese x64 desktop package
        run: python -X utf8 tools/build_touch_keyboard_desktop.py
      - name: Verify relocated package without a source checkout or OS input
        run: python -X utf8 tools/check_touch_keyboard_package.py --package .generated/touch-keyboard-desktop --report .generated/touch-keyboard-verification/package-check.json
      - name: Cross-build complete Chinese ARM64 package (not native acceptance)
        run: python -X utf8 tools/build_touch_keyboard_desktop.py --arch arm64 --output-dir .generated/touch-keyboard-desktop-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: touch-keyboard-windows-amd64-${{ github.sha }}
          path: .generated/touch-keyboard-desktop/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: touch-keyboard-package-verification-${{ github.sha }}
          path: .generated/touch-keyboard-verification/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: touch-keyboard-windows-arm64-${{ github.sha }}
          path: .generated/touch-keyboard-desktop-arm64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

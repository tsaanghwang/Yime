name: Touch bridge own TSF host (S2a)

on:
  workflow_dispatch:
  push:
    branches: ['codex/18u-tsf-own-host-s2-20261101']
    paths:
      - '.github/workflows/touch-bridge-own-host.yml'
      - 'YimeTextServiceExperiment/**'
      - 'go-backend/internal/touchhostbridge/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/input_methods/yime/yimecore/**'
      - 'go-backend/input_methods/yime/engineapi/**'
      - 'go-backend/go.mod'
      - 'go-backend/go.sum'

permissions:
  contents: read

jobs:
  native-own-host:
    if: github.ref == 'refs/heads/codex/18u-tsf-own-host-s2-20261101'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache: false
      - name: Build isolated x64 harness (no installation)
        run: |
          New-Item -ItemType Directory -Path evidence -ErrorAction Stop | Out-Null
          $ErrorActionPreference = 'Stop'
          cmake -S YimeTextServiceExperiment -B .generated/s2a-own-host -A x64 -DYIME_TOUCH_BRIDGE_OWN_HOST=ON 2>&1 | Tee-Object evidence/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Native harness configure failed' }
          cmake --build .generated/s2a-own-host --config Release --target YimeTouchBridgeOwnHost 2>&1 | Tee-Object evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native harness build failed' }
          $exe = (Resolve-Path '.generated/s2a-own-host/Release/YimeTouchBridgeOwnHost.exe' -ErrorAction Stop).Path
          @{ sourceCommit = '${{ github.sha }}'; runID = '${{ github.run_id }}'; harnessSHA256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower(); goVersion = (go version); scope = 'S2a synchronous own TSF context; no installed product or real application acceptance' } | ConvertTo-Json | Set-Content evidence/identity.json -Encoding utf8
      - name: Execute native TSF and reject skipped or missing scenarios
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YIME_TOUCH_BRIDGE_OWN_HOST = (Resolve-Path '.generated/s2a-own-host/Release/YimeTouchBridgeOwnHost.exe' -ErrorAction Stop).Path
          $report = Join-Path $PWD 'evidence/native-go-test.jsonl'
          Push-Location go-backend
          try {
            go test ./internal/touchhostbridge -run '^TestNativeOwnTSFCommit$' -count=1 -json -timeout=90s 2>&1 | Tee-Object $report
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          if ($code -ne 0) { throw 'Native TSF integration test failed' }
          $events = @(Get-Content $report | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          $expected = @('TestNativeOwnTSFCommit', 'TestNativeOwnTSFCommit/commit', 'TestNativeOwnTSFCommit/duplicate', 'TestNativeOwnTSFCommit/focus-lost')
          foreach ($name in $expected) {
            $pass = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -ceq 'pass' })
            $bad = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -in @('skip', 'fail') })
            if ($pass.Count -ne 1 -or $bad.Count -ne 0) { throw "Required native scenario did not execute and pass: $name" }
          }
          @{ sourceCommit = '${{ github.sha }}'; requiredTests = $expected; allExecutedAndPassed = $true; scope = 'native x64 own-context synchronous commit only'; physicalAcceptance = $false; installedProductAcceptance = $false } | ConvertTo-Json | Set-Content evidence/result.json -Encoding utf8
      - name: Preserve scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: touch-bridge-own-host-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

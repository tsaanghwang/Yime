# Optional diagnostic branch workflow. Original native-build test commands are
# copied from ci.yaml at d2aeef18a393327123a6ed2826a117b039879d58.
name: Verify remaining dual-product contracts

on:
  push:
    branches: ['diagnostic/yime-remaining-contracts']

permissions:
  contents: read

jobs:
  dp1n-transaction:
    name: DP1-N installer and receipt transaction
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test DP1-N isolated installer and receipt transaction
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-installer-receipt-transaction.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-receipt-v2-test-dp1n-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 DP1-N installer/receipt transaction test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-installer-receipt-transaction.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-receipt-v2-test-dp1n-ci-ps7-$runId")


name: Daily CI cleanup

on:
  schedule:
    # 03:23 Asia/Shanghai every day (19:23 UTC).
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-ci-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'tsaanghwang/Yime'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test retention protection before deletion
        run: python -m unittest discover -s tools/ci -p "test_*.py"
      - name: Delete ordinary CI data older than seven days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/cleanup_actions.py --delete

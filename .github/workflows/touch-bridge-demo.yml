name: Touch bridge isolated demo (S3b)

on:
  workflow_dispatch:
  push:
    branches: ['codex/18u-own-host-demo-s3b-20261101']
    paths:
      - '.github/workflows/touch-bridge-demo.yml'
      - 'tools/*touch_keyboard_demo*'
      - 'go-backend/cmd/yime-touch-keyboard/**'
      - 'YimeTextServiceExperiment/**'
      - 'go-backend/internal/touchhostbridge/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/input_methods/yime/yimecore/**'
      - 'go-backend/input_methods/yime/engineapi/**'
      - 'go-backend/go.mod'
      - 'go-backend/go.sum'

permissions:
  contents: read

jobs:
  native-own-host:
    if: github.ref == 'refs/heads/codex/18u-own-host-demo-s3b-20261101'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build isolated x64 harness (no installation)
        run: |
          New-Item -ItemType Directory -Path .generated/s3b-evidence -Force -ErrorAction Stop | Out-Null
          $ErrorActionPreference = 'Stop'
          cmake -S YimeTextServiceExperiment -B .generated/s3b-own-host -A x64 -DYIME_TOUCH_BRIDGE_OWN_HOST=ON -DYIME_TOUCH_BRIDGE_PERSISTENT_HOST=ON -DYIME_TOUCH_BRIDGE_DEMO_HOST=ON 2>&1 | Tee-Object .generated/s3b-evidence/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Native harness configure failed' }
          cmake --build .generated/s3b-own-host --config Release --target YimeTouchBridgeOwnHost YimeFocusCancellationTests YimeTouchBridgePersistentHost YimeTouchBridgeDemoHost 2>&1 | Tee-Object .generated/s3b-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native harness build failed' }
          & '.generated/s3b-own-host/Release/YimeFocusCancellationTests.exe' 2>&1 | Tee-Object .generated/s3b-evidence/default-guard-regression.log
          if ($LASTEXITCODE -ne 0) { throw 'Existing null-guard focus cancellation regression failed' }
          $exe = (Resolve-Path '.generated/s3b-own-host/Release/YimeTouchBridgeOwnHost.exe' -ErrorAction Stop).Path
          @{ sourceCommit = '${{ github.sha }}'; runID = '${{ github.run_id }}'; harnessSHA256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower(); goVersion = (go version); scope = 'S2b own TSF context; sync plus actual async with controlled read-lock negatives; no installed product acceptance' } | ConvertTo-Json | Set-Content .generated/s3b-evidence/identity.json -Encoding utf8
      - name: Execute native TSF and reject skipped or missing scenarios
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YIME_TOUCH_BRIDGE_OWN_HOST = (Resolve-Path '.generated/s3b-own-host/Release/YimeTouchBridgeOwnHost.exe' -ErrorAction Stop).Path
          $report = Join-Path $PWD '.generated/s3b-evidence/native-go-test.jsonl'
          Push-Location go-backend
          try {
            go test ./internal/touchhostbridge -run '^TestNativeOwnTSFCommit$' -count=1 -json -timeout=150s 2>&1 | Tee-Object $report
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          if ($code -ne 0) { throw 'Native TSF integration test failed' }
          $events = @(Get-Content $report | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          $expected = @('TestNativeOwnTSFCommit', 'TestNativeOwnTSFCommit/commit', 'TestNativeOwnTSFCommit/duplicate', 'TestNativeOwnTSFCommit/focus-lost', 'TestNativeOwnTSFCommit/async-commit', 'TestNativeOwnTSFCommit/async-focus-lost', 'TestNativeOwnTSFCommit/async-cancel', 'TestNativeOwnTSFCommit/async-old-epoch')
          foreach ($name in $expected) {
            $pass = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -ceq 'pass' })
            $bad = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -in @('skip', 'fail') })
            if ($pass.Count -ne 1 -or $bad.Count -ne 0) { throw "Required native scenario did not execute and pass: $name" }
          }
          @{ sourceCommit = '${{ github.sha }}'; requiredTests = $expected; allExecutedAndPassed = $true; scope = 'native x64 own-context sync/async commit; controlled delay is not OS latency acceptance'; physicalAcceptance = $false; installedProductAcceptance = $false } | ConvertTo-Json | Set-Content .generated/s3b-evidence/result.json -Encoding utf8
      - name: Execute existing 18u UI path with persistent own TSF context
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YIME_TOUCH_BRIDGE_UI_HOST = (Resolve-Path '.generated/s3b-own-host/Release/YimeTouchBridgePersistentHost.exe' -ErrorAction Stop).Path
          $report = Join-Path $PWD '.generated/s3b-evidence/ui-go-test.jsonl'
          Push-Location go-backend
          try {
            go test ./cmd/yime-touch-keyboard -run '^TestTouchBridgePersistentOwnHostUI$' -count=1 -json -timeout=180s 2>&1 | Tee-Object $report
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          if ($code -ne 0) { throw 'Persistent own-host UI integration failed' }
          $events = @(Get-Content $report | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          $expected = @('TestTouchBridgePersistentOwnHostUI', 'TestTouchBridgePersistentOwnHostUI/continuous-commit', 'TestTouchBridgePersistentOwnHostUI/stale-candidate', 'TestTouchBridgePersistentOwnHostUI/invalidate-rebind')
          foreach ($name in $expected) {
            $pass = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -ceq 'pass' })
            $bad = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -in @('skip', 'fail') })
            if ($pass.Count -ne 1 -or $bad.Count -ne 0) { throw "Required UI scenario missing or failed: $name" }
          }
          @{ sourceCommit = '${{ github.sha }}'; requiredTests = $expected; allExecutedAndPassed = $true; hostSHA256 = (Get-FileHash $env:YIME_TOUCH_BRIDGE_UI_HOST -Algorithm SHA256).Hash.ToLower(); scope = 'synthetic mouse messages through existing UI into persistent own TSF context; not physical or installed-product acceptance'; physicalAcceptance = $false; installedProductAcceptance = $false } | ConvertTo-Json | Set-Content .generated/s3b-evidence/ui-result.json -Encoding utf8
      - name: Check demo packaging boundaries
        run: python -m unittest discover -s tools -p test_build_touch_keyboard_demo.py -v
      - name: Restore locked complete dedicated dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tools/touch_keyboard_resources.py fetch --output-dir .generated/touch-keyboard-resources
      - name: Build independently identified x64 demo package
        run: python -X utf8 tools/build_touch_keyboard_demo.py --host .generated/s3b-own-host/Release/YimeTouchBridgeDemoHost.exe
      - name: Verify relocated complete package without TSF startup
        run: python -X utf8 tools/check_touch_keyboard_demo.py --package .generated/touch-keyboard-own-tsf-demo --report .generated/s3b-evidence/demo-package-check.json
      - name: Run actual demo entry in this isolated runner only
        run: |
          python -c "import subprocess,pathlib; exe=pathlib.Path('.generated/touch-keyboard-own-tsf-demo/YimeTouchKeyboard.exe').resolve(); r=subprocess.run([str(exe),'--own-tsf-demo','--own-tsf-demo-self-test','--touch-ui'],cwd=exe.parent,capture_output=True,timeout=240); pathlib.Path('.generated/s3b-evidence/demo-ui.log').write_bytes(r.stdout+r.stderr); assert r.returncode==0, 'demo entry failed'; assert r.stdout.count(b'PASS own-tsf-demo-package-ui')==1, 'actual demo UI marker missing'"
      - name: Retain isolated development package (not approved for user desktops)
        uses: actions/upload-artifact@v6
        with:
          name: own-tsf-demo-isolated-windows-amd64-${{ github.sha }}
          path: .generated/touch-keyboard-own-tsf-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Preserve scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: touch-bridge-demo-evidence-${{ github.sha }}
          path: .generated/s3b-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

name: Touch bridge UI persistent TSF host (S3a)

on:
  workflow_dispatch:
  push:
    branches: ['codex/18u-own-host-ui-s3a-20261101']
    paths:
      - '.github/workflows/touch-bridge-ui-host.yml'
      - 'go-backend/cmd/yime-touch-keyboard/**'
      - 'YimeTextServiceExperiment/**'
      - 'go-backend/internal/touchhostbridge/**'
      - 'go-backend/internal/keyboardlab/**'
      - 'go-backend/internal/asciicodemode/**'
      - 'go-backend/input_methods/yime/yimecore/**'
      - 'go-backend/input_methods/yime/engineapi/**'
      - 'go-backend/go.mod'
      - 'go-backend/go.sum'

permissions:
  contents: read

jobs:
  native-own-host:
    if: github.ref == 'refs/heads/codex/18u-own-host-ui-s3a-20261101'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache: false
      - name: Build isolated x64 harness (no installation)
        run: |
          New-Item -ItemType Directory -Path evidence -ErrorAction Stop | Out-Null
          $ErrorActionPreference = 'Stop'
          cmake -S YimeTextServiceExperiment -B .generated/s3a-own-host -A x64 -DYIME_TOUCH_BRIDGE_OWN_HOST=ON -DYIME_TOUCH_BRIDGE_PERSISTENT_HOST=ON 2>&1 | Tee-Object evidence/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Native harness configure failed' }
          cmake --build .generated/s3a-own-host --config Release --target YimeTouchBridgeOwnHost YimeFocusCancellationTests YimeTouchBridgePersistentHost 2>&1 | Tee-Object evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native harness build failed' }
          & '.generated/s3a-own-host/Release/YimeFocusCancellationTests.exe' 2>&1 | Tee-Object evidence/default-guard-regression.log
          if ($LASTEXITCODE -ne 0) { throw 'Existing null-guard focus cancellation regression failed' }
          $exe = (Resolve-Path '.generated/s3a-own-host/Release/YimeTouchBridgeOwnHost.exe' -ErrorAction Stop).Path
          @{ sourceCommit = '${{ github.sha }}'; runID = '${{ github.run_id }}'; harnessSHA256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower(); goVersion = (go version); scope = 'S2b own TSF context; sync plus actual async with controlled read-lock negatives; no installed product acceptance' } | ConvertTo-Json | Set-Content evidence/identity.json -Encoding utf8
      - name: Execute native TSF and reject skipped or missing scenarios
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YIME_TOUCH_BRIDGE_OWN_HOST = (Resolve-Path '.generated/s3a-own-host/Release/YimeTouchBridgeOwnHost.exe' -ErrorAction Stop).Path
          $report = Join-Path $PWD 'evidence/native-go-test.jsonl'
          Push-Location go-backend
          try {
            go test ./internal/touchhostbridge -run '^TestNativeOwnTSFCommit$' -count=1 -json -timeout=150s 2>&1 | Tee-Object $report
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          if ($code -ne 0) { throw 'Native TSF integration test failed' }
          $events = @(Get-Content $report | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          $expected = @('TestNativeOwnTSFCommit', 'TestNativeOwnTSFCommit/commit', 'TestNativeOwnTSFCommit/duplicate', 'TestNativeOwnTSFCommit/focus-lost', 'TestNativeOwnTSFCommit/async-commit', 'TestNativeOwnTSFCommit/async-focus-lost', 'TestNativeOwnTSFCommit/async-cancel', 'TestNativeOwnTSFCommit/async-old-epoch')
          foreach ($name in $expected) {
            $pass = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -ceq 'pass' })
            $bad = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -in @('skip', 'fail') })
            if ($pass.Count -ne 1 -or $bad.Count -ne 0) { throw "Required native scenario did not execute and pass: $name" }
          }
          @{ sourceCommit = '${{ github.sha }}'; requiredTests = $expected; allExecutedAndPassed = $true; scope = 'native x64 own-context sync/async commit; controlled delay is not OS latency acceptance'; physicalAcceptance = $false; installedProductAcceptance = $false } | ConvertTo-Json | Set-Content evidence/result.json -Encoding utf8
      - name: Execute existing 18u UI path with persistent own TSF context
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YIME_TOUCH_BRIDGE_UI_HOST = (Resolve-Path '.generated/s3a-own-host/Release/YimeTouchBridgePersistentHost.exe' -ErrorAction Stop).Path
          $report = Join-Path $PWD 'evidence/ui-go-test.jsonl'
          Push-Location go-backend
          try {
            go test ./cmd/yime-touch-keyboard -run '^TestTouchBridgePersistentOwnHostUI$' -count=1 -json -timeout=180s 2>&1 | Tee-Object $report
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          if ($code -ne 0) { throw 'Persistent own-host UI integration failed' }
          $events = @(Get-Content $report | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          $expected = @('TestTouchBridgePersistentOwnHostUI', 'TestTouchBridgePersistentOwnHostUI/continuous-commit', 'TestTouchBridgePersistentOwnHostUI/stale-candidate', 'TestTouchBridgePersistentOwnHostUI/invalidate-rebind')
          foreach ($name in $expected) {
            $pass = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -ceq 'pass' })
            $bad = @($events | Where-Object { $_.Test -ceq $name -and $_.Action -in @('skip', 'fail') })
            if ($pass.Count -ne 1 -or $bad.Count -ne 0) { throw "Required UI scenario missing or failed: $name" }
          }
          @{ sourceCommit = '${{ github.sha }}'; requiredTests = $expected; allExecutedAndPassed = $true; hostSHA256 = (Get-FileHash $env:YIME_TOUCH_BRIDGE_UI_HOST -Algorithm SHA256).Hash.ToLower(); scope = 'synthetic mouse messages through existing UI into persistent own TSF context; not physical or installed-product acceptance'; physicalAcceptance = $false; installedProductAcceptance = $false } | ConvertTo-Json | Set-Content evidence/ui-result.json -Encoding utf8
      - name: Preserve scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: touch-bridge-ui-host-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 5

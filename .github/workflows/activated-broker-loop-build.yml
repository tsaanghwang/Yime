name: Activated Broker loop compile and offline validation

on:
  push:
    branches: ['codex/18u-activated-broker-loop-20261102']

permissions:
  contents: read

jobs:
  compile-offline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/18u-activated-broker-loop-20261102'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Record compile-only scope
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          import json, os, pathlib
          evidence = pathlib.Path('.generated/activated-loop-evidence')
          evidence.mkdir(parents=True, exist_ok=False)
          (evidence / 'scope.json').write_text(json.dumps({'sourceCommit': os.environ['SOURCE_SHA'], 'registrationExecuted': False, 'registryTestsExecuted': False, 'nativeHostExecuted': False, 'executableDeliveryPlanned': True, 'packageExecuted': False}), encoding='utf-8')
      - name: Require nine Go mock tests without skips
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('.generated/activated-loop-evidence/go-tests.jsonl')
          with output.open('w', encoding='utf-8') as log:
              run = subprocess.run(['go', 'test', '-count=1', '-json', './internal/activatedloop'], cwd='go-backend', stdout=log, stderr=subprocess.STDOUT, timeout=240)
          events = [json.loads(line) for line in output.read_text(encoding='utf-8').splitlines() if line.strip()]
          passed = {e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e}
          if run.returncode or len(passed) != 9 or any(e.get('Action') in ['skip', 'fail'] for e in events):
              raise SystemExit('Nine mandatory Go mock tests did not pass')
      - name: Require fifty-four Python synthetic tests without skips
        run: |
          import importlib, io, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path('tools/ci').resolve()))
          suite = unittest.TestSuite()
          for name in ['test_run_activated_registration_loop', 'test_run_mycomputer_registration', 'test_collect_mycomputer_preflight', 'test_local_activation_evidence']:
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name)))
          stream = io.StringIO()
          result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          pathlib.Path('.generated/activated-loop-evidence/python-tests.log').write_text(stream.getvalue(), encoding='utf-8')
          if result.testsRun != 54 or result.skipped or not result.wasSuccessful():
              raise SystemExit('Fifty-four mandatory synthetic tests did not pass')
      - name: Compile fixed Go controller and Broker without execution
        env:
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          import pathlib, subprocess
          outputs = pathlib.Path('.generated/activated-loop-build').resolve()
          outputs.mkdir(parents=True, exist_ok=False)
          for package, name in [('yime-activated-loop', 'YimeActivatedLoopController.exe'), ('yimebroker-18u', 'YimeBroker18u.exe')]:
              with pathlib.Path('.generated/activated-loop-evidence/' + package + '-build.log').open('w', encoding='utf-8') as log:
                  run = subprocess.run(['go', 'build', '-trimpath', '-o', str(outputs / name), './cmd/' + package], cwd='go-backend', stdout=log, stderr=subprocess.STDOUT, timeout=240)
              if run.returncode:
                  raise SystemExit('Go compilation failed: ' + package)
      - name: Compile explicit MSVC targets only - no CTest or executable invocation
        run: |
          import pathlib, subprocess
          commands = [
              (['cmake', '-S', 'YimeTextServiceExperiment', '-B', '.generated/activated-loop-native', '-A', 'x64', '-DYIME_TOUCH_PRODUCT=ON', '-DYIME_MYCOMPUTER_ACTIVATION_STAGE1=ON', '-DYIME_TOUCH_REGISTERED_FORMAL_HOST=ON', '-DYIME_ACTIVATED_LOOP_ONCE=ON'], 'configure.log'),
              (['cmake', '--build', '.generated/activated-loop-native', '--config', 'Release', '--target', 'YimeActivatedLoopOnce', 'YimeTextService18u', 'YimeMyComputerActivationStage1', 'YimeRegisteredProfileObservationTests'], 'msvc-build.log')]
          for command, name in commands:
              with pathlib.Path('.generated/activated-loop-evidence/' + name).open('w', encoding='utf-8') as log:
                  run = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=300)
              if run.returncode:
                  raise SystemExit('MSVC compile-only step failed: ' + name)
      - name: Run only the pure-value profile observation tests - no Windows registry or TSF
        run: |
          import pathlib, subprocess
          executable = pathlib.Path('.generated/activated-loop-native/Release/YimeRegisteredProfileObservationTests.exe').resolve()
          if not executable.is_file():
              raise SystemExit('Mandatory offline-only observation test binary missing')
          with pathlib.Path('.generated/activated-loop-evidence/profile-observation-tests.log').open('w', encoding='utf-8') as log:
              result = subprocess.run([str(executable)], stdout=log, stderr=subprocess.STDOUT, timeout=30)
          text = pathlib.Path('.generated/activated-loop-evidence/profile-observation-tests.log').read_text(encoding='utf-8')
          expected = 'profile observation: exact match, four-field mismatch, S_FALSE, positive incomplete, FAILED, throwing sink passed (offline only)'
          if result.returncode or text.strip() != expected:
              raise SystemExit('Mandatory offline-only observation cases failed or did not execute')
      - name: Require package builder and entry offline contracts
        run: |
          import importlib, io, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path('tools/ci').resolve()))
          for name in ['test_build_activated_loop_package', 'test_prepare_activated_loop_package']:
              stream = io.StringIO()
              result = unittest.TextTestRunner(stream=stream, verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name)))
              pathlib.Path('.generated/activated-loop-evidence/' + name + '.log').write_text(stream.getvalue(), encoding='utf-8')
              if result.testsRun == 0 or result.skipped or not result.wasSuccessful():
                  raise SystemExit('Package offline contracts failed: ' + name)
      - name: Fetch existing complete locked resources without generating dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib, subprocess, sys
          with pathlib.Path('.generated/activated-loop-evidence/resources.log').open('w', encoding='utf-8') as log:
              result = subprocess.run([sys.executable, '-X', 'utf8', 'tools/touch_keyboard_resources.py', 'fetch', '--output-dir', '.generated/touch-keyboard-resources'], stdout=log, stderr=subprocess.STDOUT, timeout=240)
          if result.returncode:
              raise SystemExit('Locked resources unavailable; no substitute data')
      - name: Stage fixed files and observe actual Authenticode status without execution
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          import json, os, pathlib, shutil, sys
          root = pathlib.Path.cwd()
          evidence = (root / '.generated/activated-loop-evidence').resolve()
          binary = root / '.generated/activated-loop-package-bin'
          binary.mkdir(exist_ok=False)
          for name in ['YimeActivatedLoopController.exe', 'YimeBroker18u.exe']:
              shutil.copyfile(root / '.generated/activated-loop-build' / name, binary / name)
          for name in ['YimeActivatedLoopOnce.exe', 'YimeTextService18u.dll', 'YimeMyComputerActivationStage1.exe']:
              shutil.copyfile(root / '.generated/activated-loop-native/Release' / name, binary / name)
          for name in ['windows_job_once.py', 'validate_local_activation_evidence.py']:
              shutil.copyfile(root / 'tools/ci' / name, binary / name)
          params = evidence / 'signature-params.json'
          params.write_text(json.dumps({'BinaryDirectory': str(binary), 'OutputPath': str(evidence / 'signatures.json'), 'SourceCommit': os.environ['SOURCE_SHA']}), encoding='utf-8')
          sys.path.insert(0, str(root / 'tools/ci'))
          from windows_job_once import run_once
          state = run_once([sys.executable, str(root / 'tools/powershell/run_checked.py'), '--edition', 'ps5', '--script', str(root / 'tools/ci/collect_activated_loop_signatures.ps1'), '--params-file', str(params)], root, evidence / 'signatures-stdout.log', evidence / 'signatures-stderr.log', 90)
          (evidence / 'signature-process.json').write_text(json.dumps(state), encoding='utf-8')
          if not state['started'] or not state['treeStopped'] or state['timedOut'] or state['errorCode'] is not None or state['exitCode'] != 0:
              raise SystemExit('Signature observation did not complete')
      - name: Build and independently hash the complete development ZIP - do not launch package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, zipfile
          root = pathlib.Path.cwd()
          evidence = root / '.generated/activated-loop-evidence'
          output = root / '.generated/activated-loop-package'
          output.mkdir(exist_ok=False)
          archive = output / 'Yime18uActivatedLoop-x64.zip'
          args = [sys.executable, 'tools/ci/build_activated_loop_package.py', '--binary-directory', str(root / '.generated/activated-loop-package-bin'), '--source-root', str(root), '--data-directory', str(root / '.generated/touch-keyboard-resources'), '--runner', str(root / 'tools/ci/run_activated_registration_loop.py'), '--prepare', str(root / 'tools/ci/prepare_activated_loop_package.py'), '--readme', str(root / 'docs/project/18u-self-developed-integration/ACTIVATED_LOOP_PACKAGE.zh-CN.md'), '--signatures', str(evidence / 'signatures.json'), '--output', str(archive), '--source-commit', os.environ['SOURCE_SHA']]
          with (evidence / 'package-build.log').open('w', encoding='utf-8') as log:
              result = subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, timeout=240)
          if result.returncode:
              raise SystemExit('Package creation failed')
          with zipfile.ZipFile(archive) as zipped:
              names = zipped.namelist()
              if len(names) != 20 or len(set(names)) != 20:
                  raise SystemExit('Unexpected package file set')
              raw = zipped.read('manifest.json'); manifest = json.loads(raw)
              if manifest['sourceCommit'] != os.environ['SOURCE_SHA'] or set(names) != set(manifest['files']) | {'manifest.json'}:
                  raise SystemExit('Package source/files mismatch')
              for name, record in manifest['files'].items():
                  digest = hashlib.sha256(); size = 0
                  with zipped.open(name) as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b''):
                          size += len(block); digest.update(block)
                  if record != {'bytes': size, 'sha256': digest.hexdigest()}:
                      raise SystemExit('Package payload hash mismatch: ' + name)
          digest = hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''): digest.update(block)
          identity = {'sourceCommit': os.environ['SOURCE_SHA'], 'baseImplementation': manifest['baseImplementation'], 'sha256': digest.hexdigest(), 'bytes': archive.stat().st_size, 'manifestSHA256': hashlib.sha256(raw).hexdigest(), 'registrationExecuted': False, 'packageExecuted': False}
          (output / 'package-identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
          (evidence / 'package-identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
      - name: Retain fixed development package - no execution approval implied
        uses: actions/upload-artifact@v6
        with:
          name: activated-loop-x64-package-${{ github.sha }}
          path: .generated/activated-loop-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build and package evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: activated-loop-compile-evidence-${{ github.sha }}
          path: .generated/activated-loop-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

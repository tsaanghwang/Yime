name: Activated Broker loop compile and offline validation

on:
  push:
    branches: ['codex/18u-activated-broker-loop-20261102']

permissions:
  contents: read

jobs:
  compile-offline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/18u-activated-broker-loop-20261102'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Record compile-only scope
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          import json, os, pathlib
          evidence = pathlib.Path('.generated/activated-loop-evidence')
          evidence.mkdir(parents=True, exist_ok=False)
          (evidence / 'scope.json').write_text(json.dumps({'sourceCommit': os.environ['SOURCE_SHA'], 'registrationExecuted': False, 'registryTestsExecuted': False, 'nativeHostExecuted': False, 'executableDelivery': False}), encoding='utf-8')
      - name: Require nine Go mock tests without skips
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('.generated/activated-loop-evidence/go-tests.jsonl')
          with output.open('w', encoding='utf-8') as log:
              run = subprocess.run(['go', 'test', '-count=1', '-json', './internal/activatedloop'], cwd='go-backend', stdout=log, stderr=subprocess.STDOUT, timeout=240)
          events = [json.loads(line) for line in output.read_text(encoding='utf-8').splitlines() if line.strip()]
          passed = {e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e}
          if run.returncode or len(passed) != 9 or any(e.get('Action') in ['skip', 'fail'] for e in events):
              raise SystemExit('Nine mandatory Go mock tests did not pass')
      - name: Require fifty-four Python synthetic tests without skips
        run: |
          import importlib, io, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path('tools/ci').resolve()))
          suite = unittest.TestSuite()
          for name in ['test_run_activated_registration_loop', 'test_run_mycomputer_registration', 'test_collect_mycomputer_preflight', 'test_local_activation_evidence']:
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name)))
          stream = io.StringIO()
          result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          pathlib.Path('.generated/activated-loop-evidence/python-tests.log').write_text(stream.getvalue(), encoding='utf-8')
          if result.testsRun != 54 or result.skipped or not result.wasSuccessful():
              raise SystemExit('Fifty-four mandatory synthetic tests did not pass')
      - name: Compile fixed Go controller and Broker without execution
        env:
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          import pathlib, subprocess
          outputs = pathlib.Path('.generated/activated-loop-build').resolve()
          outputs.mkdir(parents=True, exist_ok=False)
          for package, name in [('yime-activated-loop', 'YimeActivatedLoopController.exe'), ('yimebroker-18u', 'YimeBroker18u.exe')]:
              with pathlib.Path('.generated/activated-loop-evidence/' + package + '-build.log').open('w', encoding='utf-8') as log:
                  run = subprocess.run(['go', 'build', '-trimpath', '-o', str(outputs / name), './cmd/' + package], cwd='go-backend', stdout=log, stderr=subprocess.STDOUT, timeout=240)
              if run.returncode:
                  raise SystemExit('Go compilation failed: ' + package)
      - name: Compile explicit MSVC targets only - no CTest or executable invocation
        run: |
          import pathlib, subprocess
          commands = [
              (['cmake', '-S', 'YimeTextServiceExperiment', '-B', '.generated/activated-loop-native', '-A', 'x64', '-DYIME_TOUCH_PRODUCT=ON', '-DYIME_MYCOMPUTER_ACTIVATION_STAGE1=ON', '-DYIME_TOUCH_REGISTERED_FORMAL_HOST=ON', '-DYIME_ACTIVATED_LOOP_ONCE=ON'], 'configure.log'),
              (['cmake', '--build', '.generated/activated-loop-native', '--config', 'Release', '--target', 'YimeActivatedLoopOnce', 'YimeTextService18u', 'YimeMyComputerActivationStage1'], 'msvc-build.log')]
          for command, name in commands:
              with pathlib.Path('.generated/activated-loop-evidence/' + name).open('w', encoding='utf-8') as log:
                  run = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=300)
              if run.returncode:
                  raise SystemExit('MSVC compile-only step failed: ' + name)
      - name: Preserve logs only - never upload executable package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: activated-loop-compile-evidence-${{ github.sha }}
          path: .generated/activated-loop-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Publish verified 18u ZIP without rebuild or execution

on:
  workflow_call:
    inputs:
      confirm:
        required: true
        type: string
      expected_workflow_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: publish-verified-18u-installer-bb7cc13
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'tsaanghwang/Yime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/delivery/18u-activated-loop-20261102' && github.run_attempt == 1 && inputs.confirm == 'publish-verified-installer-bb7cc13' && inputs.expected_workflow_sha == github.sha
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact existing package and publish one prerelease asset
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
        run: |
          import hashlib, io, json, os, urllib.error, urllib.parse, urllib.request, zipfile
          REPO = 'tsaanghwang/Yime'
          SOURCE = 'bb7cc136c284a5d5ee3a764749119b0b423da482'
          RUN = 41472435711
          ARTIFACT = 13156106297
          TAG = 'test-18u-installed-bb7cc13'
          NAME = 'YimeCore-18u-0.1.0-18u-test.2-windows-amd64.zip'
          ZIP_SHA = '8e3dd31fd74df54a091afa3cf2e1806422f5d1e15b1a4fcb8260e43fb6ca1ea3'
          OUTER_SHA = 'f7ab317ff31279a1a4cb93ad5def72090200268d9ce6f3a101320002349bf009'
          MANIFEST_SHA = 'e133ea4531139cdddfa48213481c83ee11172aa9fcc1f6213a6ff03c584b0484'
          BASE = 'https://api.github.com/repos/' + REPO
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/delivery/18u-activated-loop-20261102'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['CONFIRM'] == 'publish-verified-installer-bb7cc13'
          assert os.environ['EXPECTED_WORKFLOW_SHA'] == os.environ['GITHUB_SHA']
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urllib.parse.urlsplit(newurl).scheme != 'https':
                      raise RuntimeError('Non-HTTPS redirect rejected')
                  result = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if urllib.parse.urlsplit(newurl).netloc != urllib.parse.urlsplit(req.full_url).netloc:
                      result.remove_header('Authorization')
                  return result
          opener = urllib.request.build_opener(SafeRedirect())
          
          def request(path, method='GET', body=None, raw=False, missing=False, upload=False):
              url = path if upload else BASE + path
              if urllib.parse.urlsplit(url).netloc != ('uploads.github.com' if upload else 'api.github.com'):
                  raise RuntimeError('Unexpected API destination')
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Accept': 'application/octet-stream' if raw and path.startswith('/releases/assets/') else 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Yime-fixed-package-delivery'}
              if isinstance(body, dict):
                  body = json.dumps(body).encode(); headers['Content-Type'] = 'application/json'
              elif body is not None:
                  headers['Content-Type'] = 'application/zip'
              try:
                  with opener.open(urllib.request.Request(url, data=body, headers=headers, method=method), timeout=180) as response:
                      data = response.read(110_000_001)
                      if len(data) > 110_000_000:
                          raise RuntimeError('Response exceeds fixed delivery bound')
                      return data if raw else json.loads(data)
              except urllib.error.HTTPError as error:
                  if missing and method == 'GET' and error.code == 404:
                      return None
                  # Never retry ambiguous writes or print signed URLs/token headers.
                  raise RuntimeError(f'GitHub {method} failed with HTTP {error.code}') from None
          
          def require_hash(data, expected):
              if hashlib.sha256(data).hexdigest() != expected:
                  raise RuntimeError('Fixed-byte SHA256 mismatch')
          
          # Every read/validation precedes creation; a prior draft/tag is not overwritten.
          if request('/releases/tags/' + TAG, missing=True) is not None:
              raise RuntimeError('Release already exists; stop without replacing it')
          if request('/git/ref/tags/' + TAG, missing=True) is not None:
              raise RuntimeError('Tag already exists; stop without replacing it')
          run = request('/actions/runs/' + str(RUN))
          assert run['head_sha'] == SOURCE and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/installed-18u-compile.yml'
          assert run['head_repository']['full_name'] == REPO
          artifact = request('/actions/artifacts/' + str(ARTIFACT))
          assert artifact['id'] == ARTIFACT and artifact['expired'] is False
          assert artifact['name'] == 'installed-18u-x64-test-package-' + SOURCE
          assert artifact['size_in_bytes'] == 92384525
          assert artifact['digest'] == 'sha256:' + OUTER_SHA
          assert artifact['workflow_run']['id'] == RUN and artifact['workflow_run']['head_sha'] == SOURCE
          outer = request('/actions/artifacts/' + str(ARTIFACT) + '/zip', raw=True)
          assert len(outer) == 92384525
          require_hash(outer, OUTER_SHA)
          with zipfile.ZipFile(io.BytesIO(outer)) as archive:
              assert sorted(archive.namelist()) == [NAME]
              payload = archive.read(NAME)
          assert len(payload) == 92365687
          require_hash(payload, ZIP_SHA)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)) == 23
              manifest_raw = archive.read('package-evidence.json')
              require_hash(manifest_raw, MANIFEST_SHA)
              manifest = json.loads(manifest_raw)
              assert manifest['schema'] == 'installed-18u-package-evidence-v1'
              assert manifest['sourceCommit'] == SOURCE and manifest['architecture'] == 'native-x64'
              assert manifest['product'] == 'yimecore-18u' and manifest['version'] == '0.1.0-18u-test.2'
              assert manifest['installationExecuted'] is False and manifest['registrationExecuted'] is False and manifest['installedHostAcceptance'] is False
              assert set(names) == set(manifest['files']) | {'package-evidence.json'}
              for name, identity in manifest['files'].items():
                  data = archive.read(name)
                  assert len(data) == identity['bytes']
                  require_hash(data, identity['sha256'])
              descriptor_raw = archive.read('payload/installed-18u-product.json')
              require_hash(descriptor_raw, '89928fe4c4496462d9198e4be9be28b72ddb9816594b6eab7986fac766844adf')
              descriptor = json.loads(descriptor_raw)
              assert descriptor['schema'] == 'installed-18u-product-v1' and descriptor['sourceCommit'] == SOURCE
              assert descriptor['product'] == 'yimecore-18u' and descriptor['architecture'] == 'native-x64'
              assert descriptor['identity'] == {'clsid':'{6DFACE1F-562E-4773-A9D6-D5753A314711}', 'profile':'{1BD904AC-3194-4419-B70A-5574100F18B3}'}
              assert descriptor['autostart'] is False and descriptor['language'] == 'CN' and descriptor['mode'] == 'variable'
              simple = json.loads(archive.read('product-package.json'))
              assert simple['format'] == 'yime-simple-package-18u-1' and simple['product'] == 'yimecore-18u'
              assert simple['version'] == '0.1.0-18u-test.2' and simple['target'] == 'windows-amd64'
              assert len(simple['files']) == 16 and len(descriptor['files']) == 15
              actual_payload = {n for n in names if n.startswith('payload/')}
              assert actual_payload == {'payload/' + r['path'] for r in simple['files']}
              assert actual_payload == {'payload/' + r['path'] for r in descriptor['files']} | {'payload/installed-18u-product.json'}
              for row in simple['files'] + descriptor['files']:
                  data = archive.read('payload/' + row['path'])
                  assert len(data) == row['bytes']
                  require_hash(data, row['sha256'])
              pe_names = {n for n in names if n.endswith(('.exe', '.dll'))}
              assert len(pe_names) == 5
              import struct
              for name in pe_names:
                  data = archive.read(name)
                  assert data[:2] == b'MZ'
                  offset = struct.unpack_from('<I', data, 60)[0]
                  assert data[offset:offset+4] == b'PE\0\0'
                  assert struct.unpack_from('<H', data, offset+4)[0] == 0x8664
                  assert struct.unpack_from('<H', data, offset+24)[0] == 0x20b
              signatures = json.loads(archive.read('signatures.json'))
              assert signatures['schema'] == 'installed-18u-signatures-v1' and signatures['sourceCommit'] == SOURCE
              assert len(signatures['files']) == 5 and {r['path'] for r in signatures['files']} == pe_names
              for row in signatures['files']:
                  assert row['status'] == 'NotSigned' and row['signerThumbprint'] is None
                  data = archive.read(row['path'])
                  assert len(data) == row['bytes']
                  require_hash(data, row['sha256'])
          # Nothing extracted, rebuilt, imported from the package or executed.
          print('Validated exact existing installer ZIP, all 23 files, 16 payloads and observed unsigned PE identity; execution: false', flush=True)
          notes = f'''独立 18u 持久安装开发测试包，不是稳定发行，不是旧激活身份诊断包。
          test.2 修正维护生命周期与诊断；保留旧 test.1，原现场失败原因未唯一确定，真实修复效果尚未验证。
          仅 MyComputer 原生 x64 先行验证；不派发其他机器，不支持 ARM64。五个 EXE/DLL 未签名。
          源码: {SOURCE}；原构建 run {RUN}；artifact {ARTIFACT}。
          原字节 ZIP（未重建）: {NAME}，92365687 bytes。
          SHA256: {ZIP_SHA}
          package-evidence SHA256: {MANIFEST_SHA}
          编译及非注册测试通过，不代表安装、重启、已安装 TSF 激活或输入验收通过。
          发布/下载不授权执行。Setup 默认 Install 且可能请求提权，不要双击；安装、重启和宿主验收须另行确认。
          旧诊断包及既有记录保持不变；标准自研版、Rime/PIME 与各自用户数据不改动。
          交付说明: https://github.com/{REPO}/blob/{os.environ['GITHUB_SHA']}/delivery/18u-installed-bb7cc13/README.zh-CN.md
          只下载命名 ZIP；自动 Source code ZIP 不是安装测试包。'''
          release = request('/releases', 'POST', {'tag_name': TAG, 'target_commitish': SOURCE,
              'name': '18u independent installer x64 — development test bb7cc13',
              'body': notes, 'draft': True, 'prerelease': True, 'make_latest': 'false'})
          release_id = release['id']
          print(f'Created draft release {release_id}; any later failure leaves draft for inspection, no automatic retry/delete.', flush=True)
          upload = release['upload_url'].split('{')[0] + '?name=' + urllib.parse.quote(NAME)
          asset = request(upload, 'POST', payload, upload=True)
          assert asset['name'] == NAME and asset['state'] == 'uploaded' and asset['size'] == len(payload)
          assert asset['digest'] == 'sha256:' + ZIP_SHA
          roundtrip = request('/releases/assets/' + str(asset['id']), raw=True)
          assert len(roundtrip) == len(payload)
          require_hash(roundtrip, ZIP_SHA)
          assets = request('/releases/' + str(release_id) + '/assets')
          assert len(assets) == 1 and assets[0]['id'] == asset['id']
          release = request('/releases/' + str(release_id), 'PATCH', {'draft': False, 'prerelease': True, 'make_latest': 'false'})
          assert release['draft'] is False and release['prerelease'] is True and release['tag_name'] == TAG
          ref = request('/git/ref/tags/' + TAG)
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == SOURCE
          # Draft upload URLs can contain untagged identifiers; report only the canonical final tag URL.
          asset['browser_download_url'] = f'https://github.com/{REPO}/releases/download/{TAG}/{NAME}'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
              report.write(f"Release: {release['html_url']}\n\nAsset: {asset['browser_download_url']}\n\nSHA256: {ZIP_SHA}\n\nSource: {SOURCE}\n\nPackage executed: false; registration: not run.\n")
          print(json.dumps({'releaseId': release_id, 'assetId': asset['id'], 'downloadUrl': asset['browser_download_url'], 'sha256': ZIP_SHA, 'packageExecuted': False}))

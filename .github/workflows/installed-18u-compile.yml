name: Installed 18u compile and offline checks

on:
  push:
    branches: ['validation/18u-simple-installer-20261102']

permissions:
  contents: read

jobs:
  compile-offline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/18u-simple-installer-20261102'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: python {0}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Record non-registration scope
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          import json, os, pathlib
          evidence = pathlib.Path('.generated/installed-18u-evidence')
          evidence.mkdir(parents=True, exist_ok=False)
          (evidence / 'scope.json').write_text(json.dumps({
              'sourceCommit': os.environ['SOURCE_SHA'], 'scope': 'compile-and-offline-only',
              'registrationExecuted': False, 'installerExecuted': False,
              'registeredHostExecuted': False, 'packageGenerated': False,
              'userMachineExecutionApproved': False}, indent=2), encoding='utf-8')
      - name: Require fifteen Python synthetic and source-contract checks
        run: |
          import importlib, io, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path('tools/yimecore').resolve()))
          suite = unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module('test_assemble_installed_18u'))
          stream = io.StringIO()
          result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          pathlib.Path('.generated/installed-18u-evidence/python-tests.log').write_text(stream.getvalue(), encoding='utf-8')
          if result.testsRun != 15 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All fifteen synthetic checks must pass without skips')
      - name: Run only explicit mock and pure standard-runtime tests
        run: |
          import json, pathlib, subprocess
          groups = [
              ('./internal/installed18uhost', [
                  'TestInstalledCheckSingleExistingProtocol',
                  'TestManifestAndConfirmationFailBeforeProcess',
                  'TestRegisteredEvidenceRejectsMissingAndFalseClaims',
                  'TestFailureDoesNotRetryOrUninstall',
                  'TestEvidenceOutsideInstallationAndFresh',
                  'TestCanonicalNiUsesOnlyAdmittedProjection'], 'installed-mocks'),
              ('./cmd/yimecore-trial-runtime', [
                  'TestRuntimeRejectsNonlocalPipeBeforeLoadingPackage',
                  'TestResolveOptionsRequiresCompleteIndependentTrialPackage',
                  'TestInputToolbarUsesDedicatedNativeWindowsExecutable',
                  'TestOptionalToolbarFailureIsVisibleInRuntimeStatus',
                  'TestBrokerArgumentsPinMultiIndexDurabilityAndTransactionalControl',
                  'TestBrokerArgumentsAdoptPublishedTrialLayoutGeneration',
                  'TestRuntimeStatusRoundTrip',
                  'TestResolveSpeechOptionsAbsentCapabilityLeavesCoreOnly',
                  'TestResolveSpeechOptionsRejectsBadCapabilityBeforeState',
                  'TestBrokerArgumentsAddProductSpeechWithoutChangingLearningNamespace',
                  'TestSpeechDamageDoesNotBlockExistingStopOrStatusResolution'], 'standard-runtime-pure')]
          for package, expected, name in groups:
              output = pathlib.Path('.generated/installed-18u-evidence/' + name + '.jsonl')
              pattern = '^(' + '|'.join(expected) + ')$'
              with output.open('w', encoding='utf-8') as log:
                  result = subprocess.run(['go', 'test', '-count=1', '-json', '-timeout=180s', '-run', pattern, package], cwd='go-backend', stdout=log, stderr=subprocess.STDOUT, timeout=240)
              events = [json.loads(line) for line in output.read_text(encoding='utf-8').splitlines() if line.strip()]
              passed = [e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e and '/' not in e['Test']]
              if result.returncode or sorted(passed) != sorted(expected) or any(e.get('Action') in ('skip', 'fail') for e in events):
                  raise SystemExit('Mandatory pure/mock Go test failed or did not execute: ' + name)
      - name: Check changed installer syntax only in PS5 and PS7
        run: |
          import json, pathlib, subprocess, sys
          evidence = pathlib.Path('.generated/installed-18u-evidence')
          # The checked runner accepts .ps1 only. Copy module bytes for parsing,
          # never import the module or execute the copied file.
          module_copy = pathlib.Path('.generated/installed-18u-module-syntax.ps1')
          module_copy.write_bytes(pathlib.Path('installer/simple/Product.psm1').read_bytes())
          checks = [
              (module_copy, {}),
              (pathlib.Path('installer/simple/Setup.ps1'), {}),
              (pathlib.Path('installer/simple/Build-Package.ps1'), {
                  'Product': 'yimecore-18u', 'PayloadRoot': r'C:\syntax-only-payload',
                  'OutputRoot': r'C:\syntax-only-output', 'Version': 'syntax-only'})]
          for edition in ('ps5', 'ps7'):
              for index, (script, params) in enumerate(checks):
                  parameters = pathlib.Path('.generated/installed-18u-syntax-params.json')
                  parameters.write_text(json.dumps(params), encoding='utf-8')
                  with (evidence / ('syntax-' + edition + '-' + str(index) + '.log')).open('w', encoding='utf-8') as log:
                      result = subprocess.run([sys.executable, 'tools/powershell/run_checked.py', '--script', str(script), '--edition', edition, '--params-file', str(parameters), '--check-only'], stdout=log, stderr=subprocess.STDOUT, timeout=60)
                  if result.returncode:
                      raise SystemExit('PowerShell syntax-only check failed')
      - name: Compile Go runtimes and dedicated Broker without execution
        run: |
          import pathlib, subprocess
          output = pathlib.Path('.generated/installed-18u-go').resolve()
          output.mkdir(parents=True, exist_ok=False)
          commands = [
              ['go', 'build', '-trimpath', '-o', str(output / 'YimeCoreTrialRuntime.exe'), './cmd/yimecore-trial-runtime'],
              ['go', 'build', '-trimpath', '-ldflags=-X main.installed18uOnly=1', '-o', str(output / 'Yime18uInstalledRuntime.exe'), './cmd/yimecore-trial-runtime'],
              ['go', 'build', '-trimpath', '-o', str(output / 'YimeBroker18u.exe'), './cmd/yimebroker-18u']]
          for index, command in enumerate(commands):
              with pathlib.Path('.generated/installed-18u-evidence/go-build-' + str(index) + '.log').open('w', encoding='utf-8') as log:
                  result = subprocess.run(command, cwd='go-backend', stdout=log, stderr=subprocess.STDOUT, timeout=240)
              if result.returncode:
                  raise SystemExit('Go compilation failed')
      - name: Compile explicit MSVC targets and run only portable policy test
        run: |
          import pathlib, subprocess
          commands = [
              (['cmake', '-S', 'YimeTextServiceExperiment', '-B', '.generated/installed-18u-native', '-A', 'x64', '-DYIME_TOUCH_PRODUCT=ON', '-DYIME_TOUCH_REGISTERED_FORMAL_HOST=ON', '-DYIME_18U_PRODUCT_REGISTRATION=ON'], 'configure.log'),
              (['cmake', '--build', '.generated/installed-18u-native', '--config', 'Release', '--target', 'YimeTextService18u', 'Yime18uProductRegistration', 'YimeTouchRegisteredFormalHostTests', 'Yime18uProductRegistrationPolicyTests'], 'msvc-build.log'),
              ([str(pathlib.Path('.generated/installed-18u-native/Release/Yime18uProductRegistrationPolicyTests.exe').resolve())], 'pure-policy.log')]
          for command, name in commands:
              with pathlib.Path('.generated/installed-18u-evidence/' + name).open('w', encoding='utf-8') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=300 if name != 'pure-policy.log' else 30)
              if result.returncode:
                  raise SystemExit('Explicit compile/pure-policy step failed: ' + name)
          policy = pathlib.Path('.generated/installed-18u-evidence/pure-policy.log').read_text(encoding='utf-8')
          if policy.count('product registration policy: CLI, absence, removal sequencing, bounded residue passed') != 1:
              raise SystemExit('Pure policy success marker missing')
      - name: Preserve text evidence only - no package or executable upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: installed-18u-compile-evidence-${{ github.sha }}
          path: |
            .generated/installed-18u-evidence/*.json
            .generated/installed-18u-evidence/*.jsonl
            .generated/installed-18u-evidence/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

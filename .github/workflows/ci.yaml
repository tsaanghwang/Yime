name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, yime-stable, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main, yime-stable]

permissions:
  contents: read

# Superseded automatic branch/PR runs stop spending runner minutes. Manual runs
# and tags have unique groups so a push cannot cancel an intentional validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-contract:
    name: build-contract / validate-build-contract
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject weakened YIME build pipelines
        shell: pwsh
        run: .\tools\validate-build-contract.ps1
      - name: Verify locked Windows toolchain metadata
        run: python .\tools\verify_toolchain_lock.py
      - name: Verify detached lexicon archive identity
        run: python .\tools\lexicon\verify_external_archive_lock.py
      - name: Test CI scheduling and failure propagation
        run: python .\tools\ci\test_workflow_contract.py
      - name: Verify dual-product source contracts before expensive tests
        shell: pwsh
        run: |
          $runId = [Guid]::NewGuid().ToString('N')
          python .\tools\dual-product\baseline.py --output ".tmp/dual-product/dp1-ci-preflight-$runId/baseline.json"
      - name: Guard and track libIME2 component commits
        shell: pwsh
        env:
          LIBIME2_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'libime2-change-report.tsv'
          .\tools\check-libime2-change-boundary.ps1 `
            -BaseRef $env:LIBIME2_BASE_SHA `
            -HeadRef '${{ github.sha }}' `
            -ReportPath $report
      - name: Upload libIME2 change report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: libime2-change-report-${{ github.sha }}
          path: ${{ runner.temp }}/libime2-change-report.tsv
          if-no-files-found: error
          retention-days: 30
      - name: Test libIME2 gate rejection paths
        shell: pwsh
        run: .\tools\test-libime2-change-boundary.ps1

  lexicon-offline-tooling:
    name: lexicon-offline-tooling
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Use current stable Python 3.14 series
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/lexicon/pyproject.toml
      - name: Use Go 1.26.4 for cross-language handoff replay
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go-backend/go.sum
      - name: Enforce repository data boundary
        shell: pwsh
        run: python .\tools\lexicon\check_repository_data_boundary.py
      - name: Verify internal PSC outline snapshot
        shell: pwsh
        run: python .\tools\verify_psc_outline_snapshot.py
      - name: Verify offline tool environment and locked handoff
        shell: pwsh
        run: |
          python -m pip install -e ".\tools\lexicon[test]"
          .\tools\lexicon\test.ps1
      - name: Replay the approved fixed handoff through Go codemode
        shell: pwsh
        run: .\tools\lexicon\replay-approved-handoff.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'approved-handoff-replay')
      - name: Evaluate the exact packaged lexicon and layout identity
        shell: pwsh
        run: .\tools\evaluation\run.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'target-locked-evaluation')
      - name: Require source-level reproducibility for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .\tools\lexicon\invoke-python.ps1 tools\lexicon\verify_release_readiness.py --require-release

  rust-i686-host:
    name: rust-i686-host
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned i686 host toolchain
        run: rustup toolchain install stable-i686-pc-windows-msvc --profile minimal
      - name: Run Rust checks
        shell: pwsh
        run: |
          Set-Location PIMELauncher
          cargo fmt --check
          rustup run stable-i686-pc-windows-msvc cargo test --verbose

  go-tests:
    name: go-tests
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Use Go 1.26.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go-backend/go.sum
      - name: Run Go regression tests
        shell: pwsh
        run: .\tools\test-go.ps1
      - name: Test Go health protocol with native PowerShell clients
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $evidence = Join-Path $pwd ('.tmp/health-interop-ci-' + [guid]::NewGuid().ToString('N'))
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\yimecore\test-native-health-interop.ps1 -OutputPath (Join-Path $evidence 'ps5.json')
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 health interop failed with exit code $LASTEXITCODE" }
          & .\tools\yimecore\test-native-health-interop.ps1 -OutputPath (Join-Path $evidence 'ps7.json')
      - name: Run PSC Python tooling regression tests
        shell: pwsh
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Run Rime compiled-cache freshness regression tests
        shell: pwsh
        run: .\tools\test-rime-cache-freshness.ps1
      - name: Run installed particle-a Stage 6D verifier regression tests
        shell: pwsh
        run: .\tools\test-installed-particle-a-stage6d-verifier.ps1

  real-rime-tests:
    name: real-rime-tests
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Use Go 1.26.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go-backend/go.sum
      - name: Run real Rime integration tests
        shell: pwsh
        run: .\tools\test-real-rime.ps1

  go-race-msys2:
    name: go-race-msys2
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Use Go 1.26.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go-backend/go.sum
      - name: Install MSYS2 UCRT64 GCC for Go race detector
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Run Go race detector
        shell: pwsh
        run: |
          $gcc = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin\gcc.exe'
          .\tools\test-go-race.ps1 -GccPath $gcc -TimeoutSeconds 300

  native-build:
    name: native-build
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw 'A Visual Studio installation with x86/x64 VC tools was not found.' }
          $vsDevCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat was not found at $vsDevCmd" }
          $envDump = Join-Path $env:RUNNER_TEMP 'vsdevcmd-env.txt'
          cmd /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && set > `"$envDump`""
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd.bat failed.' }
          Get-Content $envDump | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Install pinned i686 host toolchain
        run: rustup toolchain install stable-i686-pc-windows-msvc --profile minimal
      - name: Verify vendored Win32 build dependencies
        run: python .\tools\verify_vendored_build_dependencies.py
      - name: Verify Win32 Rust and offline dependency pins
        shell: pwsh
        run: .\tools\assert-win32-build-prerequisites.ps1 -RequireToolchain
      - name: Build Win32 C++ components
        shell: cmd
        run: |
          call "%VSINSTALLDIR%Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64 >nul
          cmake . -Bbuild -G "Visual Studio 17 2022" -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release
      - name: Build x64 C++ components
        shell: cmd
        run: |
          call "%VSINSTALLDIR%Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          cmake . -Bbuild64 -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build64 --config Release --target PIMETextService PIMERpcResponseTests PIMERegistrationStatus
      - name: Run native C++ regression tests (Win32)
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run x64 PIME RPC regression tests
        shell: pwsh
        run: ctest --test-dir build64 -C Release -R "^PIMERpcResponseTests$" --output-on-failure
      - name: Verify native build outputs
        shell: pwsh
        run: .\tools\test-build-guards.ps1 -SkipPackagedRime
      - name: Test staged installer build lease and publication contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-staged-installer-build.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-staged-build-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 staged-installer-build test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-staged-installer-build.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-staged-build-ci-ps7-$runId")
      - name: Stage native installer inputs
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'yime-native'
          New-Item -ItemType Directory -Path "$stage\build\PIMELauncher", "$stage\build\PIMETextService\Release", "$stage\build64\PIMETextService\Release" -Force | Out-Null
          Copy-Item build\PIMELauncher\PIMELauncher.exe "$stage\build\PIMELauncher\PIMELauncher.exe"
          Copy-Item build\PIMETextService\Release\PIMETextService.dll "$stage\build\PIMETextService\Release\PIMETextService.dll"
          Copy-Item build\PIMETextService\Release\PIMERegistrationStatus.exe "$stage\build\PIMETextService\Release\PIMERegistrationStatus.exe"
          Copy-Item build64\PIMETextService\Release\PIMETextService.dll "$stage\build64\PIMETextService\Release\PIMETextService.dll"
          Copy-Item build64\PIMETextService\Release\PIMERegistrationStatus.exe "$stage\build64\PIMETextService\Release\PIMERegistrationStatus.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: yime-native-${{ github.sha }}
          path: ${{ runner.temp }}/yime-native
          if-no-files-found: error
          retention-days: 14

  nsis-preflight:
    name: nsis-preflight
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [build-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Prepare pinned NSIS in non-secret packaging job
        id: nsis
        uses: ./.github/actions/prepare-pinned-nsis
        with:
          nsis-version: 3.12
      - name: Test pinned NSIS preparation in PowerShell 5 and 7
        shell: pwsh
        env:
          NSIS_ARCHIVE: ${{ steps.nsis.outputs.archive-path }}
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N').Substring(0,16)
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\test-prepare-pinned-nsis.ps1 `
            -ArchivePath $env:NSIS_ARCHIVE -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-preparation-test-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 pinned NSIS preparation test failed with exit code $LASTEXITCODE" }
          .\tools\ci\test-prepare-pinned-nsis.ps1 `
            -ArchivePath $env:NSIS_ARCHIVE -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-preparation-test-ci-ps7-$runId")
      - name: Test DP1-K NSIS compiler membership interval
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-nsis-compiler-interval.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-interval-test-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 DP1-K compiler-interval test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-nsis-compiler-interval.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-interval-test-ci-ps7-$runId")

  contract-tests:
    name: contract-tests
    runs-on: windows-2022
    timeout-minutes: 40
    needs: [build-contract, lexicon-offline-tooling, rust-i686-host, native-build, go-tests, real-rime-tests, go-race-msys2, nsis-preflight]
    steps:
      - uses: actions/checkout@v6
      - name: Test YimeCore local-product readiness contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\yimecore\test-local-product-readiness.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 local-product readiness test failed with exit code $LASTEXITCODE" }
          .\tools\yimecore\test-local-product-readiness.ps1
      - name: Test YimeCore local-product build contracts
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\yimecore\test-local-product-build-result.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 test-local-product-build-result.ps1 failed with exit code $LASTEXITCODE" }
          .\tools\yimecore\test-local-product-build-result.ps1
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\yimecore\test-local-product-speech-build.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\yimecore-experiment\speech-build-contract-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 test-local-product-speech-build.ps1 failed with exit code $LASTEXITCODE" }
          .\tools\yimecore\test-local-product-speech-build.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\yimecore-experiment\speech-build-contract-ci-ps7-$runId")
      - name: Test YimeCore local12 maintenance preparation
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\yimecore\test-local12-maintenance-preparation.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 local12 maintenance preparation test failed with exit code $LASTEXITCODE" }
          .\tools\yimecore\test-local12-maintenance-preparation.ps1
      - name: Test YimeCore native desktop rollback rehearsal
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\yimecore\test-native-desktop-rehearsal.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 native desktop rehearsal test failed with exit code $LASTEXITCODE" }
          .\tools\yimecore\test-native-desktop-rehearsal.ps1
      - name: Test YimeCore guarded maintenance preparation and native observations
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $evidence = Join-Path $pwd ('.tmp/native-maintenance-ci-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence | Out-Null
          foreach ($test in @('test-local13-maintenance-preparation.ps1', 'test-native-maintenance-evidence.ps1', 'test-native-maintenance-context.ps1', 'test-local13-maintenance-inputs.ps1', 'test-native-maintenance-processes.ps1', 'test-native-rehearsal-outcome.ps1', 'test-native-rehearsal-outcome-reader.ps1', 'test-native-maintenance-child.ps1', 'test-native-maintenance-data.ps1', 'test-native-maintenance-backup.ps1', 'test-native-maintenance-deferred-delete.ps1', 'test-native-maintenance-visibility.ps1', 'test-native-maintenance-runtime.ps1', 'test-native-maintenance-health.ps1', 'test-native-rollback-collection.ps1')) {
            & $ps5 -NoProfile -ExecutionPolicy Bypass -File (Join-Path '.\tools\yimecore' $test) -OutputPath (Join-Path $evidence ($test + '-ps5.json'))
            if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 $test failed with exit code $LASTEXITCODE" }
            & (Join-Path '.\tools\yimecore' $test) -OutputPath (Join-Path $evidence ($test + '-ps7.json'))
          }
      - name: Test exact payload-closure rejection model
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-payload-closure.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-payload-closure-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 payload-closure test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-payload-closure.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-payload-closure-ci-ps7-$runId")
      - name: Test pre-package copy-stage contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-package-staging.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-staging-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 package-staging test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-package-staging.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-staging-ci-ps7-$runId")
      - name: Test deterministic NSIS stage include contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-nsis-stage.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-stage-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 NSIS-stage test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-nsis-stage.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-stage-ci-ps7-$runId")
      - name: Test NSIS compiler input closure contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-nsis-toolchain-closure.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-toolchain-closure-test-ci-ps5-$runId") -SyntheticOnly
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 NSIS toolchain-closure test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-nsis-toolchain-closure.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-nsis-toolchain-closure-test-ci-ps7-$runId") -SyntheticOnly
      - name: Test DP1-J isolated NSIS membership monitor
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-nsis-membership-monitor-v1.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-j-membership-test-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 DP1-J membership-monitor test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-nsis-membership-monitor-v1.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-j-membership-test-ci-ps7-$runId")
      - name: Test post-build archive extraction contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-postbuild-extraction.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-postbuild-extraction-test-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 postbuild-extraction test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-postbuild-extraction.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-postbuild-extraction-test-ci-ps7-$runId")
      - name: Test canonical package receipt v2 contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')
          & $ps5 -NoProfile -ExecutionPolicy Bypass -File .\tools\dual-product\test-rime-pime-package-receipt-v2.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-receipt-v2-test-ci-ps5-$runId")
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 package-receipt-v2 test failed with exit code $LASTEXITCODE" }
          .\tools\dual-product\test-rime-pime-package-receipt-v2.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-receipt-v2-test-ci-ps7-$runId")
      - name: Test DP1-O isolated current-source candidate runner contract
        shell: pwsh
        run: |
          $ps5 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $runId = [Guid]::NewGuid().ToString('N')

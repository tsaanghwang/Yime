  dp1-long-contracts:
    name: dp1-long-contracts / ${{ matrix.suite }} / ${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 60
    needs: [build-contract, lexicon-offline-tooling, rust-i686-host, native-build, go-tests, real-rime-tests, go-race-msys2, nsis-preflight]
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        suite: [installer-transaction, receipt-store, evidence-archive]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CI_TEST_SHELL: ${{ matrix.shell }}
      CI_TEST_TAG: ${{ matrix.shell == 'powershell' && 'ps5' || 'ps7' }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify actual PowerShell test host
        run: |
          if (($env:CI_TEST_SHELL -eq 'powershell' -and $PSVersionTable.PSVersion.Major -ne 5) -or
              ($env:CI_TEST_SHELL -eq 'pwsh' -and $PSVersionTable.PSVersion.Major -lt 7)) {
            throw 'The matrix shell does not match the actual PowerShell test host.'
          }
      - name: Test retained receipt publication and crash recovery
        if: matrix.suite == 'receipt-store'
        run: |
          # Keep the existing short Win32 path budget and run the complete suite.
          $runId = [Guid]::NewGuid().ToString('N').Substring(0,16)
          .\tools\dual-product\test-rime-pime-receipt-v2-store.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-receipt-v2-test-store-$env:CI_TEST_TAG-$runId")
      - name: Test DP1-N isolated installer and receipt transaction
        if: matrix.suite == 'installer-transaction'
        run: |
          # Keep the existing short Win32 path budget and run the complete suite.
          $runId = [Guid]::NewGuid().ToString('N').Substring(0,16)
          .\tools\dual-product\test-rime-pime-installer-receipt-transaction.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-package-receipt-v2-test-dp1n-ci-$env:CI_TEST_TAG-$runId")
      - name: Test DP1-Q candidate evidence archive contract
        if: matrix.suite == 'evidence-archive'
        run: |
          # Keep the existing short Win32 path budget and run the complete suite.
          $runId = [Guid]::NewGuid().ToString('N').Substring(0,16)
          .\tools\dual-product\test-rime-pime-candidate-evidence-archive.ps1 `
            -OutputRoot (Join-Path $pwd ".tmp\dual-product\dp1-candidate-evidence-archive-test-ci-$env:CI_TEST_TAG-$runId")
      - name: Retain isolated contract summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: dp1-contract-${{ matrix.suite }}-${{ matrix.shell }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .tmp/dual-product/dp1-package-receipt-v2-test-store-*/store-result.json
            .tmp/dual-product/dp1-package-receipt-v2-test-dp1n-ci-*/transaction-result.json
            .tmp/dual-product/dp1-candidate-evidence-archive-test-ci-*/candidate-evidence-archive-result.json*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  installer-payload:
    name: installer-payload
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [build-contract, lexicon-offline-tooling, rust-i686-host, native-build, go-tests, real-rime-tests, go-race-msys2, nsis-preflight, contract-tests, dp1-long-contracts]
    steps:
      - uses: actions/checkout@v6
      - name: Restore native installer inputs
        uses: actions/download-artifact@v7
        with:
          name: yime-native-${{ github.sha }}
          path: .
      - name: Use Go 1.26.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go-backend/go.sum
      - name: Use Python 3.14 for package handoff verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build Go backend package
        shell: pwsh
        run: |
          Push-Location go-backend
          cmd /C build.bat
          if ($LASTEXITCODE -ne 0) { throw "go-backend build failed with exit code $LASTEXITCODE" }
          Pop-Location
      - name: Verify complete packaged PE architecture and static CRT closure
        shell: pwsh
        run: .\tools\verify-pe-architectures.ps1
      - name: Seal default x86/x64 package plan
        shell: pwsh
        run: .\tools\dual-product\rime-pime-package-plan.ps1 -WritePlan -PlanRepoRoot $env:GITHUB_WORKSPACE -OutputPlanPath (Join-Path $env:GITHUB_WORKSPACE 'installer\package-plan.json')
      - name: Verify packaged dictionaries, manifests, layout and help
        shell: pwsh
        run: |
          python .\tools\lexicon\verify_package_handoff.py `
            --package-root .\go-backend\build\go-backend\input_methods\yime `
            --output (Join-Path $env:RUNNER_TEMP 'package-handoff.json')
      - name: Upload unsigned installer payload
        uses: actions/upload-artifact@v6
        with:
          name: yime-unsigned-payload-${{ github.sha }}
          path: |
            build/PIMELauncher/PIMELauncher.exe
            build/PIMETextService/Release/PIMETextService.dll
            build/PIMETextService/Release/PIMERegistrationStatus.exe
            build64/PIMETextService/Release/PIMETextService.dll
            build64/PIMETextService/Release/PIMERegistrationStatus.exe
            go-backend/build/go-backend
            installer/package-plan.json
            installer/package-plan.json.sha256
          if-no-files-found: error
          retention-days: 14

  release-sign-payload:
    name: release-sign-payload
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 15
    environment: release-signing
    needs: [installer-payload]
    steps:
      - uses: actions/checkout@v6
      - name: Checkout trusted signing implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-signing
          sparse-checkout: tools
          persist-credentials: false
      - name: Move trusted signing implementation outside source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '.trusted-signing'
          $trustedRoot = Join-Path $env:RUNNER_TEMP 'yime-trusted-signing'
          if (Test-Path -LiteralPath $trustedRoot) { throw 'Trusted signing runner-temp destination already exists.' }
          Move-Item -LiteralPath $source -Destination $trustedRoot
          if ((Test-Path -LiteralPath $source) -or
              -not (Test-Path -LiteralPath (Join-Path $trustedRoot 'tools\sign-release.ps1') -PathType Leaf)) {
            throw 'Trusted signing implementation did not move completely outside the source checkout.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "YIME_TRUSTED_SIGNING_ROOT=$trustedRoot" -Encoding utf8
      - name: Restore unsigned installer payload
        uses: actions/download-artifact@v7
        with:
          name: yime-unsigned-payload-${{ github.sha }}
          path: .
      - name: Import release signing certificate
        shell: pwsh
        env:
          YIME_SIGN_CERT_BASE64: ${{ secrets.YIME_SIGN_CERT_BASE64 }}
          YIME_SIGN_CERT_PASSWORD: ${{ secrets.YIME_SIGN_CERT_PASSWORD }}
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\import-release-signing-certificate.ps1')
      - name: Sign release payload
        shell: pwsh
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\sign-release.ps1') -Root $env:GITHUB_WORKSPACE -RequireComplete -PackagePlanPath (Join-Path $env:GITHUB_WORKSPACE 'installer\package-plan.json')
      - name: Verify signed release payload
        shell: pwsh
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\verify-release-signatures.ps1') -Root $env:GITHUB_WORKSPACE
      - name: Upload signed installer payload
        uses: actions/upload-artifact@v6
        with:
          name: yime-signed-payload-${{ github.sha }}
          path: |
            build/PIMELauncher/PIMELauncher.exe
            build/PIMETextService/Release/PIMETextService.dll
            build/PIMETextService/Release/PIMERegistrationStatus.exe
            build64/PIMETextService/Release/PIMETextService.dll
            build64/PIMETextService/Release/PIMERegistrationStatus.exe
            go-backend/build/go-backend
            installer/package-plan.json
            installer/package-plan.json.sha256
          if-no-files-found: error
          retention-days: 14

  unsigned-installer-package:
    name: unsigned-installer-package
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [installer-payload, nsis-preflight]
    steps:
      - uses: actions/checkout@v6
      - name: Restore unsigned installer payload
        uses: actions/download-artifact@v7
        with:
          name: yime-unsigned-payload-${{ github.sha }}
          path: .
      - name: Prepare pinned NSIS in non-secret packaging job
        id: nsis
        uses: ./.github/actions/prepare-pinned-nsis
        with:
          nsis-version: 3.12
      - name: Build the installer
        shell: pwsh
        run: .\tools\build-rime-pime-installer.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PackagePlanPath (Join-Path $env:GITHUB_WORKSPACE 'installer\package-plan.json')
      - name: Write source-identity-aware build manifest
        shell: pwsh
        run: .\tools\write-build-manifest.ps1
      - name: Validate unsigned installer artifact without native installation
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\version.txt -Raw).Trim()
          $expectedLeaf = "YIME-$version-setup.exe"
          $installers = @(Get-ChildItem -LiteralPath .\installer -File -Filter 'YIME-*-setup.exe')
          if ($installers.Count -ne 1 -or $installers[0].Name -cne $expectedLeaf) {
            throw "Unsigned installer identity is ambiguous or differs from version.txt: expected $expectedLeaf; found $(@($installers.Name) -join ', ')"
          }
          $installer = $installers[0]
          .\tools\test-installer-smoke.ps1 -InstallerPath $installer.FullName -StaticOnly `
            -ExpectedCommit $env:GITHUB_SHA -ExpectedRef $env:GITHUB_REF -ExpectedSignedRelease false `
            -ExpectedSourceTreeDirty false
      - uses: actions/upload-artifact@v6
        with:
          name: YIME-unsigned-test-installer-${{ github.sha }}
          path: |
            installer/YIME-*-setup.exe
            installer/build-manifest.json
            installer/package-plan.json
            installer/package-plan.json.sha256
            installer/package-build-receipt.json
            installer/package-build-receipt.json.sha256
          if-no-files-found: error
          retention-days: 30

  release-installer-package:
    name: release-installer-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [release-sign-payload, nsis-preflight]
    steps:
      - uses: actions/checkout@v6
      - name: Block tagged installer until signed-uninstaller and removal closure
        shell: pwsh
        run: throw 'Tagged Rime/PIME installer release is disabled until the embedded uninstaller is trusted and exact payload/font removal with durable recovery is sealed.'
      - name: Restore signed installer payload
        uses: actions/download-artifact@v7
        with:
          name: yime-signed-payload-${{ github.sha }}
          path: .
      - name: Prepare pinned NSIS in non-secret packaging job
        uses: ./.github/actions/prepare-pinned-nsis
        with:
          nsis-version: 3.12
      - name: Build unsigned outer installer
        shell: pwsh
        run: .\tools\build-rime-pime-installer.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PackagePlanPath (Join-Path $env:GITHUB_WORKSPACE 'installer\package-plan.json')
      - name: Upload unsigned outer installer
        uses: actions/upload-artifact@v6
        with:
          name: yime-unsigned-outer-installer-${{ github.sha }}
          path: |
            installer/YIME-*-setup.exe
            installer/package-build-receipt.json
            installer/package-build-receipt.json.sha256
          if-no-files-found: error
          retention-days: 14

  release-sign-installer:
    name: release-sign-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 15
    environment: release-signing
    needs: [release-sign-payload, release-installer-package]
    steps:
      - uses: actions/checkout@v6
      - name: Checkout trusted signing implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-signing
          sparse-checkout: tools
          persist-credentials: false
      - name: Move trusted signing implementation outside source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '.trusted-signing'
          $trustedRoot = Join-Path $env:RUNNER_TEMP 'yime-trusted-signing'
          if (Test-Path -LiteralPath $trustedRoot) { throw 'Trusted signing runner-temp destination already exists.' }
          Move-Item -LiteralPath $source -Destination $trustedRoot
          if ((Test-Path -LiteralPath $source) -or
              -not (Test-Path -LiteralPath (Join-Path $trustedRoot 'tools\sign-release.ps1') -PathType Leaf)) {
            throw 'Trusted signing implementation did not move completely outside the source checkout.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "YIME_TRUSTED_SIGNING_ROOT=$trustedRoot" -Encoding utf8
      - name: Restore signed installer payload
        uses: actions/download-artifact@v7
        with:
          name: yime-signed-payload-${{ github.sha }}
          path: .
      - name: Restore unsigned outer installer
        uses: actions/download-artifact@v7
        with:
          name: yime-unsigned-outer-installer-${{ github.sha }}
          path: installer
      - name: Import release signing certificate
        shell: pwsh
        env:
          YIME_SIGN_CERT_BASE64: ${{ secrets.YIME_SIGN_CERT_BASE64 }}
          YIME_SIGN_CERT_PASSWORD: ${{ secrets.YIME_SIGN_CERT_PASSWORD }}
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\import-release-signing-certificate.ps1')
      - name: Sign outer installer and refresh its sealed receipt
        shell: pwsh
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\sign-release.ps1') -Root $env:GITHUB_WORKSPACE -IncludeInstaller -PackagePlanPath (Join-Path $env:GITHUB_WORKSPACE 'installer\package-plan.json') -ReceiptPath (Join-Path $env:GITHUB_WORKSPACE 'installer\package-build-receipt.json')
      - name: Verify complete tagged release signatures
        shell: pwsh
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\verify-release-signatures.ps1') -Root $env:GITHUB_WORKSPACE -IncludeInstaller
      - name: Write source-identity-aware signed build manifest
        shell: pwsh
        run: |
          & (Join-Path $env:YIME_TRUSTED_SIGNING_ROOT 'tools\write-build-manifest.ps1') -RepoRoot $env:GITHUB_WORKSPACE -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'installer\build-manifest.json')
      - name: Upload signed installer
        uses: actions/upload-artifact@v6
        with:
          name: YIME-signed-installer
          path: |
            installer/YIME-*-setup.exe
            installer/build-manifest.json
            installer/package-plan.json
            installer/package-plan.json.sha256
            installer/package-build-receipt.json
            installer/package-build-receipt.json.sha256
          if-no-files-found: error
          retention-days: 30

  installer-package:
    name: installer-package
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [installer-payload, unsigned-installer-package, release-sign-installer]
    steps:
      - name: Preserve protected installer-package contract
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PAYLOAD_RESULT: ${{ needs['installer-payload'].result }}
          UNSIGNED_RESULT: ${{ needs['unsigned-installer-package'].result }}
          SIGNED_RESULT: ${{ needs['release-sign-installer'].result }}
        run: |
          test "$PAYLOAD_RESULT" = success
          if test "$IS_TAG" = true; then
            test "$UNSIGNED_RESULT" = skipped
            test "$SIGNED_RESULT" = success
          else
            test "$UNSIGNED_RESULT" = success
            test "$SIGNED_RESULT" = skipped
          fi

  core-build:
    name: core-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-contract, lexicon-offline-tooling, rust-i686-host, native-build, go-tests, real-rime-tests, go-race-msys2, nsis-preflight, contract-tests, dp1-long-contracts, installer-package]
    steps:
      - name: Preserve legacy aggregate build contract
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs['build-contract'].result }}
          LEXICON_RESULT: ${{ needs['lexicon-offline-tooling'].result }}
          RUST_RESULT: ${{ needs['rust-i686-host'].result }}
          NATIVE_RESULT: ${{ needs['native-build'].result }}
          GO_RESULT: ${{ needs['go-tests'].result }}
          REAL_RIME_RESULT: ${{ needs['real-rime-tests'].result }}
          RACE_RESULT: ${{ needs['go-race-msys2'].result }}
          NSIS_RESULT: ${{ needs['nsis-preflight'].result }}
          CONTRACT_TEST_RESULT: ${{ needs['contract-tests'].result }}
          LONG_CONTRACT_RESULT: ${{ needs['dp1-long-contracts'].result }}
          INSTALLER_RESULT: ${{ needs['installer-package'].result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$LEXICON_RESULT" = success
          test "$RUST_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$GO_RESULT" = success
          test "$REAL_RIME_RESULT" = success
          test "$RACE_RESULT" = success
          test "$NSIS_RESULT" = success
          test "$CONTRACT_TEST_RESULT" = success
          test "$LONG_CONTRACT_RESULT" = success
          test "$INSTALLER_RESULT" = success

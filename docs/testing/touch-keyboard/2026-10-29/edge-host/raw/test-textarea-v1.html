<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>触屏输入临时测试</title><style>body{font-family:Segoe UI,Microsoft YaHei,sans-serif;margin:24px;background:#fff;color:#222}h1{font-size:22px;margin:0 0 12px}label{display:block;margin-bottom:8px}textarea{box-sizing:border-box;width:100%;height:160px;resize:vertical;font-size:28px;line-height:1.5;padding:12px;border:2px solid #456}button{font-size:18px;margin-top:8px;padding:8px 16px}</style><h1>触屏输入临时测试</h1><p>请点击输入框放好光标，再在虚拟键盘中绑定目标。</p><form autocomplete="off"><label for="test-text">测试文字</label><textarea id="test-text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="测试文字"></textarea><button type="reset">清空测试文字</button></form></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>触屏输入临时测试</title>
  <style>
    body { font-family: Segoe UI, Microsoft YaHei, sans-serif; margin: 12px; background: #fff; color: #222; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { font-size: 14px; line-height: 1.4; margin: 0 0 8px; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 6px; }
    label { font-size: 16px; }
    #codepoints { display: block; margin: 0 0 4px; font: 14px/1.4 Consolas, monospace; overflow-wrap: anywhere; }
    button { font-size: 18px; min-height: 40px; padding: 6px 14px; }
    textarea { display: block; box-sizing: border-box; width: 100%; height: 90px; min-height: 80px; resize: vertical; overflow: auto; font-size: 24px; line-height: 1.4; padding: 8px; border: 2px solid #456; }
  </style>
</head>
<body>
  <h1>触屏输入临时测试</h1>
  <p>点输入框放好光标，再在虚拟键盘中绑定目标。</p>
  <form autocomplete="off">
    <div class="controls">
      <label for="test-text">测试文字</label>
      <button type="reset">清空测试文字</button>
    </div>
    <output id="codepoints" dir="ltr" aria-live="polite">编码：空</output>
    <textarea id="test-text" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="测试文字"></textarea>
  </form>
  <script>
    (() => {
      const field = document.getElementById('test-text');
      const output = document.getElementById('codepoints');
      const update = () => {
        const chars = Array.from(field.value);
        const codes = chars.slice(0, 12).map(c => 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'));
        output.textContent = '编码：' + (codes.join(' ') || '空') + (chars.length > 12 ? ' …' : '') + ' | dir=' + getComputedStyle(field).direction;
      };
      field.addEventListener('input', update);
      field.addEventListener('change', update);
      field.addEventListener('focus', update);
      field.form.addEventListener('reset', () => setTimeout(update, 0));
      update();
    })();
  </script>
</body>
</html>
